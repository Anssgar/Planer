<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zakupy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F1E8; --bg-grad: #F5F1E8; --surface: #FAF7F2; --surface-alt: #EFE8DA;
    --column-bg: #F2EDE2; --primary: #B5735A; --primary-deep: #96593F; --secondary: #E8DCC8;
    --sage: #8B9474; --sage-bg: #E7EAE0; --sage-text: #5E6A4C; --gold: #C99A4A; --gold-bg: #F1E4C8; --gold-text: #7A5C22;
    --text: #2E2A24; --text-soft: #8A7F70; --border: #E3DDD0; --shadow: rgba(60, 50, 35, 0.10);
    --danger: #B15C4A; --danger-bg: #F1DDD5;
  }
  * { box-sizing: border-box; }
  button, input, textarea, select { font-family: inherit; color: inherit; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text); min-height: 100vh; padding-bottom: 60px;
  }
  h1, h2, h3 { font-family: 'Fredoka', sans-serif; font-weight: 500; }
  header.top { padding: 20px 20px 8px; max-width: 900px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { margin: 0; font-size: 23px; font-weight: 500; color: var(--primary-deep); }
  .brand svg { width: 34px; height: 34px; flex-shrink: 0; }
  .tagline { margin: 2px 0 0; color: var(--text-soft); font-size: 13.5px; }

  .tabs { max-width: 900px; margin: 18px auto 0; padding: 0 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tab-btn {
    padding: 8px 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-soft); font-weight: 700; font-size: 13.5px; cursor: pointer;
  }
  .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  main { max-width: 900px; margin: 18px auto 0; padding: 0 20px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar button {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px;
    font-weight: 700; font-size: 13px; color: var(--primary-deep); cursor: pointer;
  }
  .toolbar button:hover { background: var(--surface-alt); }

  .add-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
  .add-bar input, .add-bar select {
    padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 14px;
  }
  .add-bar input[name=name] { flex: 2; min-width: 140px; }
  .add-bar input[name=qty] { width: 70px; }
  .add-bar select { flex: 1; min-width: 100px; }
  .add-bar button {
    background: var(--primary); color: white; border: none; border-radius: 8px; padding: 0 18px;
    font-weight: 700; cursor: pointer; font-size: 14px;
  }
  .add-bar button:hover { background: var(--primary-deep); }

  .cat-group { margin-bottom: 20px; }
  .cat-group h3 { font-size: 14.5px; font-weight: 700; color: var(--primary-deep); margin: 0 0 9px; padding-left: 2px; letter-spacing: 0.2px; }
  .item-row {
    display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 7px; box-shadow: 0 1px 3px var(--shadow);
  }
  .item-row.checked { opacity: 0.55; }
  .item-row input[type=checkbox] { width: 19px; height: 19px; accent-color: var(--primary); flex-shrink: 0; cursor: pointer; }
  .item-row .name { flex: 1; font-weight: 700; font-size: 14.5px; cursor: pointer; }
  .item-row.checked .name { text-decoration: line-through; color: var(--text-soft); }
  .item-row .qty { font-size: 12px; color: var(--text-soft); font-weight: 700; background: var(--column-bg); padding: 3px 9px; border-radius: 8px; }
  .item-row .store-badge { font-size: 10.5px; font-weight: 700; color: var(--sage-text); background: var(--sage-bg); padding: 3px 8px; border-radius: 8px; }
  .item-row .src-badge { font-size: 10.5px; font-weight: 700; color: var(--gold-text); background: var(--gold-bg); padding: 3px 8px; border-radius: 8px; }
  .item-row .icon-btn { background: none; border: none; color: var(--text-soft); cursor: pointer; padding: 4px; flex-shrink: 0; }
  .item-row .icon-btn:hover { color: var(--primary-deep); }
  .item-row .icon-btn.del:hover { color: var(--danger); }
  .item-row .icon-btn svg { width: 16px; height: 16px; }

  .edit-row { background: var(--column-bg); border-radius: 12px; padding: 10px; margin: -3px 0 7px; display: flex; flex-wrap: wrap; gap: 7px; }
  .edit-row input, .edit-row select { padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; flex: 1; min-width: 90px; }
  .edit-row button { background: var(--primary); color: white; border: none; border-radius: 7px; padding: 0 14px; font-weight: 700; cursor: pointer; font-size: 13px; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-soft); }
  .empty-state h2 { color: var(--primary-deep); margin: 6px 0 4px; font-size: 18px; }

  .simple-list { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px; }
  .simple-row { display: flex; align-items: center; gap: 8px; padding: 9px 8px; border-bottom: 1px solid var(--border); }
  .simple-row:last-child { border-bottom: none; }
  .simple-row .row-label { flex: 1; font-weight: 700; font-size: 14.5px; }
  .simple-row input.rename-input { flex: 1; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); font-size: 14px; display: none; }
  .simple-row.editing .row-label { display: none; }
  .simple-row.editing input.rename-input { display: block; }
  .row-btn { background: none; border: none; color: var(--text-soft); cursor: pointer; padding: 4px; flex-shrink: 0; }
  .row-btn:hover { color: var(--primary-deep); }
  .row-btn.del:hover { color: var(--danger); }
  .row-btn svg { width: 16px; height: 16px; }
  .add-inline { display: flex; gap: 8px; padding: 10px 6px 4px; }
  .add-inline input { flex: 1; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 14px; }
  .add-inline button { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 0 16px; font-weight: 700; cursor: pointer; }

  .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-bar input, .filter-bar select { padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; }
  .filter-bar input { flex: 2; min-width: 140px; }
  .filter-bar select { flex: 1; min-width: 120px; }

  .prod-row { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .prod-row .prod-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .prod-row .prod-name { font-weight: 700; font-size: 14.5px; flex: 1; min-width: 100px; }
  .type-badge { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
  .type-badge.spozywcze { background: var(--sage-bg); color: var(--sage-text); }
  .type-badge.niespozywcze { background: var(--gold-bg); color: var(--gold-text); }
  .prod-fields { display: flex; flex-wrap: wrap; gap: 7px; }
  .prod-fields label { display: flex; flex-direction: column; gap: 3px; font-size: 10.5px; color: var(--text-soft); font-weight: 700; flex: 1; min-width: 95px; }
  .prod-fields input, .prod-fields select { padding: 6px 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--column-bg); font-size: 12.5px; width: 100%; }
  .prod-add-form { background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; padding: 12px; margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .prod-add-form input, .prod-add-form select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 13.5px; flex: 1; min-width: 100px; }
  .prod-add-form button { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 0 16px; font-weight: 700; cursor: pointer; }

  .planer-hint { color: var(--text-soft); font-size: 13px; margin: 0 0 14px; }
  .planer-timestamp { color: var(--text-soft); font-size: 12px; margin: 10px 0 0; }
  .planer-item-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 7px; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block !important; position: absolute; top: 0; left: 0; width: 100%; padding: 20px; }
  }
</style>

  <div class="brand">
    <svg viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="24" fill="var(--secondary)"/>
      <path d="M14 18h20l-2.2 15.4a3 3 0 01-3 2.6H19.2a3 3 0 01-3-2.6L14 18Z" fill="var(--surface)" stroke="var(--primary-deep)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M18 18v-2a6 6 0 0112 0v2" stroke="var(--primary)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="20.5" cy="24.5" r="1.6" fill="var(--primary)"/>

<script>
// ==== jsonbin.io — magazyn WŁASNY tej apki (lista zakupów + sklepy) ====
const JSONBIN_API_KEY = '$2a$10$W148CMyGUUl1iGtoArLw0Oq7sQ49NyL/WoL0agc3g/rWvSXdbCvdK';
let JSONBIN_BIN_ID = '6ab8f57fac6210605afa8aaf';
const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';
const JSONBIN_POLL_MS = 6000;

// ==== jsonbin.io — magazyn WSPÓLNY z planerem (produkty + kategorie zakupowe) ====
const PLANER_JSONBIN_API_KEY = JSONBIN_API_KEY;
const PLANER_BIN_ID = '6aa90506ac6210605acf4f8b';

function jsonbinEmptyState(){
  return { items:{}, stores:{} };
}
function genId(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,9); }

const DEFAULT_STORES = ['Biedronka','Lidl','Żabka','Rossmann','Inne'];
const DEFAULT_UNITS = ['g','kg','ml','l','szt','łyżka','łyżeczka','szklanka','opakowanie','ząbek','pęczek','plaster','garść','puszka'];

function showJsonbinConfigWarning(msg){
  const main = document.getElementById('mainArea');
  if(main) main.innerHTML = '<div class="empty-state"><h2>Konfiguracja jsonbin.io</h2><p>' + msg + '</p></div>';
}
function showBinIdBanner(id){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(40,30,20,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = '<div style="background:#FAF7F2;border-radius:16px;padding:22px;max-width:420px;font-family:\'Nunito\',sans-serif;">' +
    '<h2 style="margin:0 0 10px;color:#96593F;font-family:\'Fredoka\',sans-serif;">Pierwsze uruchomienie</h2>' +
    '<p style="font-size:14px;line-height:1.5;color:#2E2A24;">Utworzono nowy magazyn danych na jsonbin.io. Skopiuj poniższe ID i wklej je jako wartość <code>JSONBIN_BIN_ID</code> na górze pliku.</p>' +
    '<input readonly value="' + id + '" style="width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #ccc;font-size:14px;margin:10px 0;" onclick="this.select()">' +
    '<button id="binIdBannerCloseBtn" style="width:100%;padding:10px;border-radius:10px;border:none;background:#B5735A;color:#fff;font-weight:800;cursor:pointer;">Rozumiem, zapisałem</button></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#binIdBannerCloseBtn').addEventListener('click', () => overlay.remove());
}

function createJsonBinDb(){
  let state = jsonbinEmptyState();
  let pendingSave = false;
  let saveTimer = null;
  const collectionListeners = {};

  function notifyCollection(name){
    const set = collectionListeners[name];
    if(!set) return;
    set.forEach(entry => {
      const ids = Object.keys(state[name] || {});
      const docs = ids.map(id => ({ id, data: () => state[name][id] }));
      entry.cb({ docs });
    });
  }
  function notifyAll(){ Object.keys(collectionListeners).forEach(notifyCollection); }

  async function ensureBin(){
    if(JSONBIN_BIN_ID) return true;
    try {
      const seeded = jsonbinEmptyState();
      DEFAULT_STORES.forEach(name => { const id = genId(); seeded.stores[id] = { name, createdAt: Date.now() }; });
      const res = await fetch(JSONBIN_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY, 'X-Bin-Name': 'zakupy' },
        body: JSON.stringify(seeded)
      });
      const json = await res.json();
      if(json && json.metadata && json.metadata.id){
        JSONBIN_BIN_ID = json.metadata.id;
        showBinIdBanner(JSONBIN_BIN_ID);
        return true;
      }
    } catch(e){ console.error('jsonbin create error', e); }
    return false;
  }
  async function pullRemote(){
    try {
      const res = await fetch(JSONBIN_BASE + '/' + JSONBIN_BIN_ID + '/latest', { headers: { 'X-Master-Key': JSONBIN_API_KEY } });
      if(!res.ok) return;
      const json = await res.json();
      if(pendingSave) return;
      const nextState = Object.assign(jsonbinEmptyState(), json.record || {});
      if(JSON.stringify(nextState) === JSON.stringify(state)) return;
      state = nextState;
      notifyAll();
    } catch(e){ console.error('jsonbin pull error', e); }
  }
  function schedulePush(){
    pendingSave = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        await fetch(JSONBIN_BASE + '/' + JSONBIN_BIN_ID, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
          body: JSON.stringify(state)
        });
      } catch(e){ console.error('jsonbin push error', e); }
      pendingSave = false;
    }, 350);
  }

  function docRef(coll, id){
    return {
      async update(patch){
        if(!state[coll]) state[coll] = {};
        state[coll][id] = { ...(state[coll][id]||{}), ...patch };
        notifyCollection(coll); schedulePush();
      },
      async delete(){
        if(state[coll]) delete state[coll][id];
        notifyCollection(coll); schedulePush();
      }
    };
  }
  function collectionRef(name){
    return {
      onSnapshot(cb){
        const entry = { cb };
        if(!collectionListeners[name]) collectionListeners[name] = new Set();
        collectionListeners[name].add(entry);
        notifyCollection(name);
        return () => collectionListeners[name].delete(entry);
      },
      async add(data){
        const id = genId();
        if(!state[name]) state[name] = {};
        state[name][id] = { ...data };
        notifyCollection(name); schedulePush();
        return { id };
      }
    };
  }

  (async () => {
    if(!JSONBIN_API_KEY){ showJsonbinConfigWarning('Uzupełnij stałą <code>JSONBIN_API_KEY</code> na górze pliku i odśwież stronę.'); return; }
    const ok = await ensureBin();
    if(!ok){ showJsonbinConfigWarning('Nie udało się połączyć z jsonbin.io — sprawdź klucz API i połączenie z internetem.'); return; }
    await pullRemote();
    setInterval(pullRemote, JSONBIN_POLL_MS);
  })();

  return {
    doc(path){ const parts = path.split('/'); return docRef(parts[0], parts[1]); },
    collection(name){ return collectionRef(name); }
  };
}

// ==== Wspolna baza produktow i kategorii (zyje w binie Planera) ====
async function fetchPlanerRecord(){
  const res = await fetch('https://api.jsonbin.io/v3/b/' + PLANER_BIN_ID + '/latest', { headers: { 'X-Master-Key': PLANER_JSONBIN_API_KEY } });
  if(!res.ok) throw new Error('Nie udało się pobrać danych planera (HTTP ' + res.status + ')');
  const json = await res.json();
  return json.record || {};
}
async function pushPlanerRecord(record){
  await fetch('https://api.jsonbin.io/v3/b/' + PLANER_BIN_ID, {
    method: 'PUT',
    headers: { 'Content-Type':'application/json', 'X-Master-Key': PLANER_JSONBIN_API_KEY },
    body: JSON.stringify(record)
  });
}
async function updatePlanerRecord(mutateFn){
  const record = await fetchPlanerRecord();
  record.products = record.products || [];
  record.shoppingCategories = record.shoppingCategories || [];
  mutateFn(record);
  await pushPlanerRecord(record);
  return record;
}

let products = [];
let sharedCategories = [];
let planerLastFetch = null;

async function refreshSharedData(){
  try {
    const record = await fetchPlanerRecord();
    products = Array.isArray(record.products) ? record.products : [];
    sharedCategories = Array.isArray(record.shoppingCategories) ? record.shoppingCategories : [];
    planerLastFetch = new Date();
    if(activeTab === 'products' || activeTab === 'categories') renderMain();
    refreshSelects();
  } catch(e){ console.error('refreshSharedData error', e); }
}
function findProductByName(name){
  const n = (name||'').trim().toLowerCase();
  if(!n) return null;
  return products.find(p => (p.name||'').trim().toLowerCase() === n)
    || products.find(p => (p.name||'').trim().length > 2 && n.includes((p.name||'').trim().toLowerCase()));
}

async function fetchPlanerShoppingList(){
  const record = await fetchPlanerRecord();
  return Array.isArray(record.shopping) ? record.shopping : [];
}

const BASKET = '\u{1F6D2}';
let db = null;
let items = [], stores = [];
let activeTab = 'list';
let editingItemId = null;
let planerPreviewItems = null;
let productSearch = '';
let productCategoryFilter = '';

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init(){
  db = createJsonBinDb();
  refreshSharedData();
  setInterval(refreshSharedData, JSONBIN_POLL_MS);

  db.collection('items').onSnapshot(snap => { items = snap.docs.map(d => ({ id: d.id, ...d.data() })); if(activeTab==='list') renderMain(); });
  db.collection('stores').onSnapshot(snap => { stores = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderMain(); refreshSelects(); });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      editingItemId = null;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b===btn));
      renderMain();
    });
  });

  renderMain();
}

function renderMain(){
  const main = document.getElementById('mainArea');
  if(activeTab === 'list') return renderListTab(main);
  if(activeTab === 'planer') return renderPlanerTab(main);
  if(activeTab === 'products') return renderProductsTab(main);
  if(activeTab === 'categories') return renderCategoriesTab(main);
  if(activeTab === 'stores') return renderStoresTab(main);
}

function renderListTab(main){
  const cats = sharedCategories.map(c => c.name);
  items.forEach(i => { if(i.category && !cats.includes(i.category)) cats.push(i.category); });
  if(!cats.includes('Inne')) cats.push('Inne');

  let html = '' +
    '<div class="toolbar">' +
      '<button id="clearCheckedBtn">Usuń zaznaczone (kupione)</button>' +
      '<button id="copyListBtn">Kopiuj listę</button>' +
      '<button id="exportPdfBtn">Eksportuj do PDF</button>' +
    '</div>' +
    '<div class="add-bar">' +
      '<input type="text" name="name" id="newItemName" placeholder="Nazwa produktu…" autocomplete="off">' +
      '<input type="text" name="qty" id="newItemQty" placeholder="Ilość">' +
      '<select id="newItemUnit"></select>' +
      '<select id="newItemCategory"></select>' +
      '<select id="newItemStore"></select>' +
      '<button id="addItemBtn">Dodaj</button>' +
    '</div>';

  if(!items.length){
    html += '<div class="empty-state">' + BASKET + '<h2>Lista jest pusta</h2><p>Dodaj pierwszy produkt powyżej.</p></div>';
    main.innerHTML = html;
    wireAddBar(); refreshSelects();
    return;
  }

  cats.forEach(cat => {
    const catItems = items.filter(i => (i.category || 'Inne') === cat);
    if(!catItems.length) return;
    html += '<div class="cat-group"><h3>' + escapeHtml(cat) + '</h3>';
    catItems.forEach(it => {
      const isEditing = editingItemId === it.id;
      html += '<div class="item-row ' + (it.checked?'checked':'') + '" data-id="' + it.id + '">' +
        '<input type="checkbox" class="buy-cb" ' + (it.checked?'checked':'') + '>' +
        '<span class="name" data-edit="' + it.id + '">' + escapeHtml(it.name) + '</span>' +
        ((it.qty!=null && it.qty!=='') ? '<span class="qty">' + escapeHtml(String(it.qty)) + (it.unit?' '+escapeHtml(it.unit):'') + '</span>' : '') +
        (it.store ? '<span class="store-badge">' + escapeHtml(it.store) + '</span>' : '') +
        (it.source==='planer' ? '<span class="src-badge">z planera</span>' : '') +
        '<button class="icon-btn" data-edit-btn="' + it.id + '" title="Edytuj"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18 10a2.8 2.8 0 00-4-4L4 16v4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>' +
        '<button class="icon-btn del" data-del="' + it.id + '"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>' +
      '</div>' +
      (isEditing ? (
        '<div class="edit-row" id="editRow-' + it.id + '">' +
        '<input type="text" data-f="name" value="' + escapeHtml(it.name) + '" placeholder="Nazwa">' +
        '<input type="text" data-f="qty" value="' + escapeHtml(it.qty||'') + '" placeholder="Ilość" style="max-width:80px;">' +
        '<select data-f="unit">' + unitOptionsHtml(it.unit) + '</select>' +
        '<select data-f="category">' + catOptionsHtml(it.category, cats) + '</select>' +
        '<select data-f="store">' + storeOptionsHtml(it.store) + '</select>' +
        '<button data-save-edit="' + it.id + '">Zapisz</button>' +
        '</div>'
      ) : '');
    });
    html += '</div>';
  });

  main.innerHTML = html;
  wireAddBar();
  refreshSelects();

  main.querySelectorAll('.buy-cb').forEach(cb => cb.addEventListener('change', () => {
    const id = cb.closest('.item-row').dataset.id;
    db.doc('items/'+id).update({ checked: cb.checked });
  }));
  main.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => {
    db.doc('items/'+btn.dataset.del).delete();
  }));
  main.querySelectorAll('[data-edit-btn]').forEach(btn => btn.addEventListener('click', () => {
    editingItemId = editingItemId === btn.dataset.editBtn ? null : btn.dataset.editBtn;
    renderMain();
  }));
  main.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => {
    editingItemId = editingItemId === el.dataset.edit ? null : el.dataset.edit;
    renderMain();
  }));
  main.querySelectorAll('[data-save-edit]').forEach(btn => btn.addEventListener('click', () => {
    const id = btn.dataset.saveEdit;
    const row = document.getElementById('editRow-'+id);
    const patch = {};
    row.querySelectorAll('[data-f]').forEach(inp => { patch[inp.dataset.f] = inp.value; });
    db.doc('items/'+id).update(patch);
    editingItemId = null;
  }));
  document.getElementById('clearCheckedBtn').addEventListener('click', () => {
    items.filter(i => i.checked).forEach(i => db.doc('items/'+i.id).delete());
  });
  document.getElementById('copyListBtn').addEventListener('click', copyListToClipboard);
  document.getElementById('exportPdfBtn').addEventListener('click', exportListToPdf);
}

function wireAddBar(){
  const addBtn = document.getElementById('addItemBtn');
  const nameInput = document.getElementById('newItemName');
  const qtyInput = document.getElementById('newItemQty');
  const unitSel = document.getElementById('newItemUnit');
  const catSel = document.getElementById('newItemCategory');
  const storeSel = document.getElementById('newItemStore');
  nameInput.addEventListener('input', () => {
    const match = findProductByName(nameInput.value);
    if(!match) return;
    if(match.category){
      if(![...catSel.options].some(o => o.value === match.category)) catSel.insertAdjacentHTML('beforeend', '<option value="' + escapeHtml(match.category) + '">' + escapeHtml(match.category) + '</option>');
      catSel.value = match.category;
    }
    if(match.unit && [...unitSel.options].some(o => o.value === match.unit)) unitSel.value = match.unit;
    if(match.store && [...storeSel.options].some(o => o.value === match.store)) storeSel.value = match.store;
  });
  const add = async () => {
    const name = nameInput.value.trim();
    if(!name) return;
    const qty = qtyInput.value.trim();
    const unit = unitSel.value || '';
    const category = catSel.value || 'Inne';
    const store = storeSel.value || '';
    await db.collection('items').add({ name, qty, unit, checked: false, category, store, source: 'manual', createdAt: Date.now() });
    nameInput.value = ''; qtyInput.value = ''; unitSel.value = ''; storeSel.value = '';
    nameInput.focus();
  };
  addBtn.addEventListener('click', add);
  nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') add(); });
}
function refreshSelects(){
  const catSel = document.getElementById('newItemCategory');
  const storeSel = document.getElementById('newItemStore');
  const unitSel = document.getElementById('newItemUnit');
  if(catSel) catSel.innerHTML = catOptionsHtml('', sharedCategories.map(c=>c.name));
  if(storeSel) storeSel.innerHTML = storeOptionsHtml('');
  if(unitSel) unitSel.innerHTML = '<option value="">Jedn.</option>' + DEFAULT_UNITS.map(u => '<option value="' + u + '">' + u + '</option>').join('');
}
function unitOptionsHtml(current){
  return '<option value="">-</option>' + DEFAULT_UNITS.map(u => '<option value="' + u + '" ' + (u===current?'selected':'') + '>' + u + '</option>').join('');
}
function catOptionsHtml(current, extra){
  const names = sharedCategories.map(c=>c.name);
  (extra||[]).forEach(n => { if(!names.includes(n)) names.push(n); });
  if(current && !names.includes(current)) names.push(current);
  if(!names.includes('Inne')) names.push('Inne');
  return names.map(n => '<option value="' + escapeHtml(n) + '" ' + (n===current?'selected':'') + '>' + escapeHtml(n) + '</option>').join('');
}
function storeOptionsHtml(current){
  return '<option value="">Bez sklepu</option>' + stores.map(s => '<option value="' + escapeHtml(s.name) + '" ' + (s.name===current?'selected':'') + '>' + escapeHtml(s.name) + '</option>').join('');
}

function copyListToClipboard(){
  const cats = [...new Set(items.map(i => i.category || 'Inne'))];
  let text = 'Lista zakupów:\n\n';
  cats.forEach(cat => {
    const catItems = items.filter(i => (i.category||'Inne') === cat && !i.checked);
    if(!catItems.length) return;
    text += cat + ':\n';
    catItems.forEach(it => { text += '- ' + it.name + (it.qty?(' (' + it.qty + (it.unit?' '+it.unit:'') + ')'):'') + (it.store?(' [' + it.store + ']'):'') + '\n'; });
    text += '\n';
  });
  navigator.clipboard.writeText(text).then(() => alert('Lista skopiowana do schowka.')).catch(() => alert('Nie udało się skopiować — spróbuj ręcznie zaznaczyć tekst.'));
}
function exportListToPdf(){
  const cats = [...new Set(items.map(i => i.category || 'Inne'))];
  let html = '<h1 style="font-family:sans-serif;color:#96593F;">Lista zakupów</h1><p style="color:#8A7F70;font-family:sans-serif;font-size:13px;">' + new Date().toLocaleDateString('pl-PL') + '</p>';
  cats.forEach(cat => {
    const catItems = items.filter(i => (i.category||'Inne') === cat);
    if(!catItems.length) return;
    html += '<h3 style="font-family:sans-serif;color:#2E2A24;border-bottom:1px solid #ccc;padding-bottom:4px;">' + escapeHtml(cat) + '</h3><ul style="font-family:sans-serif;">';
    catItems.forEach(it => {
      html += '<li style="' + (it.checked?'text-decoration:line-through;color:#999;':'') + '">' + escapeHtml(it.name) + (it.qty?(' - ' + escapeHtml(String(it.qty)) + (it.unit?' '+escapeHtml(it.unit):'')):'') + (it.store?(' (' + escapeHtml(it.store) + ')'):'') + '</li>';
    });
    html += '</ul>';
  });
  document.getElementById('printArea').innerHTML = html;
  window.print();
}

async function renderPlanerTab(main){
  main.innerHTML = '<p class="planer-hint">Podgląd listy zakupów zapisanej teraz w planerze obiadów — nic się tu automatycznie nie synchronizuje, kliknij, żeby odświeżyć.</p>' +
    '<div class="toolbar"><button id="fetchPlanerListBtn">Pobierz aktualną listę z planera</button></div>' +
    '<div id="planerPreviewArea"></div>';
  document.getElementById('fetchPlanerListBtn').addEventListener('click', loadPlanerPreview);
  if(planerPreviewItems) renderPlanerPreview();
}
async function loadPlanerPreview(){
  const area = document.getElementById('planerPreviewArea');
  area.innerHTML = '<p class="planer-hint">Pobieranie…</p>';
  try {
    planerPreviewItems = await fetchPlanerShoppingList();
    renderPlanerPreview();
  } catch(e){
    area.innerHTML = '<p class="planer-hint">Nie udało się pobrać danych z planera — spróbuj ponownie.</p>';
  }
}
function renderPlanerPreview(){
  const area = document.getElementById('planerPreviewArea');
  if(!planerPreviewItems || !planerPreviewItems.length){
    area.innerHTML = '<p class="planer-hint">Lista zakupów w planerze jest pusta.</p>';
    return;
  }
  const cats = [...new Set(planerPreviewItems.map(i => i.category || 'Inne'))];
  let html = '';
  cats.forEach(cat => {
    const catItems = planerPreviewItems.filter(i => (i.category||'Inne') === cat);
    html += '<div class="cat-group"><h3>' + escapeHtml(cat) + '</h3>';
    catItems.forEach((it) => {
      html += '<div class="planer-item-row">' +
        '<span class="name" style="flex:1;font-weight:700;font-size:14.5px;">' + escapeHtml(it.name) + '</span>' +
        ((it.qty!=null && it.qty!=='') ? '<span class="qty">' + escapeHtml(String(it.qty)) + (it.unit?' '+escapeHtml(it.unit):'') + '</span>' : '') +
        '<button class="icon-btn" data-transfer-name="' + escapeHtml(it.name) + '" data-transfer-qty="' + escapeHtml(it.qty||'') + '" data-transfer-unit="' + escapeHtml(it.unit||'') + '" data-transfer-cat="' + escapeHtml(it.category||'Inne') + '" title="Przenieś na główną listę">&#10148;</button>' +
      '</div>';
    });
    html += '</div>';
  });
  html += '<p class="planer-timestamp">Pobrano: ' + (planerLastFetch ? planerLastFetch.toLocaleTimeString('pl-PL') : '') + '</p>';
  area.innerHTML = html;
  area.querySelectorAll('[data-transfer-name]').forEach(btn => btn.addEventListener('click', async () => {
    const name = btn.dataset.transferName;
    const existing = items.find(i => i.name.trim().toLowerCase() === name.trim().toLowerCase());
    if(existing){
      await db.doc('items/'+existing.id).update({ qty: btn.dataset.transferQty, unit: btn.dataset.transferUnit, category: btn.dataset.transferCat, source: 'planer' });
    } else {
      await db.collection('items').add({ name, qty: btn.dataset.transferQty, unit: btn.dataset.transferUnit, checked: false, category: btn.dataset.transferCat, store: '', source: 'planer', createdAt: Date.now() });
    }
    btn.textContent = '\u2713'; btn.disabled = true;
  }));
}

async function saveProductField(name, field, value){
  await updatePlanerRecord(record => {
    let p = record.products.find(x => (x.name||'').trim().toLowerCase() === name.trim().toLowerCase());
    if(!p){ p = { id: genId(), name, type: 'niespozywcze', category: 'Inne', unit: '' }; record.products.push(p); }
    p[field] = value;
  });
  await refreshSharedData();
}

function renderProductsTab(main){
  let html = '<div class="filter-bar">' +
    '<input type="text" id="prodSearchInput" placeholder="Szukaj produktu…" value="' + escapeHtml(productSearch) + '">' +
    '<select id="prodCategoryFilter"><option value="">Wszystkie kategorie</option>' + sharedCategories.map(c => '<option value="' + escapeHtml(c.name) + '" ' + (c.name===productCategoryFilter?'selected':'') + '>' + escapeHtml(c.name) + '</option>').join('') + '</select>' +
  '</div>';

  const q = productSearch.trim().toLowerCase();
  let rows = products.filter(p => (!q || p.name.toLowerCase().includes(q)) && (!productCategoryFilter || p.category === productCategoryFilter));
  rows = rows.slice().sort((a,b) => a.name.localeCompare(b.name, 'pl'));

  html += rows.length ? rows.map(r => (
    '<div class="prod-row" data-name="' + escapeHtml(r.name) + '">' +
      '<div class="prod-top">' +
        '<span class="prod-name">' + escapeHtml(r.name) + '</span>' +
        '<span class="type-badge ' + (r.type==='niespozywcze'?'niespozywcze':'spozywcze') + '">' + (r.type==='niespozywcze'?'Niespożywcze':'Spożywcze') + '</span>' +
      '</div>' +
      '<div class="prod-fields">' +
        '<label>Kategoria<select data-field="category">' + catOptionsHtml(r.category, sharedCategories.map(c=>c.name)) + '</select></label>' +
        '<label>Jednostka<select data-field="unit">' + unitOptionsHtml(r.unit) + '</select></label>' +
        '<label>Domyślny sklep<select data-field="store">' + storeOptionsHtml(r.store) + '</select></label>' +
        '<label>Cena zwykła<input type="number" step="0.01" min="0" data-field="priceNormal" value="' + (r.priceNormal!=null?r.priceNormal:'') + '" placeholder="0,00 zł"></label>' +
        '<label>Najniższa promocyjna<input type="number" step="0.01" min="0" data-field="pricePromoLow" value="' + (r.pricePromoLow!=null?r.pricePromoLow:'') + '" placeholder="0,00 zł"></label>' +
        '<label>Typowa promocja<input type="number" step="0.01" min="0" data-field="pricePromoTypical" value="' + (r.pricePromoTypical!=null?r.pricePromoTypical:'') + '" placeholder="0,00 zł"></label>' +
      '</div>' +
    '</div>'
  )).join('') : '<div class="empty-state"><h2>Brak produktów</h2><p>Produkty spożywcze pojawią się tu same z planera obiadów, albo dodaj poniżej coś niespożywczego.</p></div>';

  html += '<div class="prod-add-form">' +
    '<input type="text" id="newProdName" placeholder="Nazwa nowego produktu…">' +
    '<select id="newProdType"><option value="niespozywcze">Niespożywcze</option><option value="spozywcze">Spożywcze</option></select>' +
    '<select id="newProdCategory">' + catOptionsHtml('', sharedCategories.map(c=>c.name)) + '</select>' +
    '<select id="newProdUnit">' + unitOptionsHtml('szt') + '</select>' +
    '<select id="newProdStore">' + storeOptionsHtml('') + '</select>' +
    '<button id="addProdBtn">Dodaj produkt</button>' +
  '</div>';

  main.innerHTML = html;

  document.getElementById('prodSearchInput').addEventListener('input', e => { productSearch = e.target.value; renderProductsTab(main); });
  document.getElementById('prodCategoryFilter').addEventListener('change', e => { productCategoryFilter = e.target.value; renderProductsTab(main); });

  main.querySelectorAll('.prod-row').forEach(rowEl => {
    const name = rowEl.dataset.name;
    rowEl.querySelectorAll('[data-field]').forEach(el => {
      el.addEventListener('change', () => {
        let val = el.value;
        if(el.type === 'number') val = val === '' ? null : parseFloat(val);
        saveProductField(name, el.dataset.field, val);
      });
    });
  });

  document.getElementById('addProdBtn').addEventListener('click', async () => {
    const name = document.getElementById('newProdName').value.trim();
    if(!name) return;
    const type = document.getElementById('newProdType').value;
    await updatePlanerRecord(record => {
      if(record.products.some(p => (p.name||'').trim().toLowerCase() === name.toLowerCase())) return;
      record.products.push({
        id: genId(), name, type,
        category: document.getElementById('newProdCategory').value || 'Inne',
        unit: document.getElementById('newProdUnit').value || '',
        store: document.getElementById('newProdStore').value || '',
        priceNormal: null, pricePromoLow: null, pricePromoTypical: null
      });
    });
    document.getElementById('newProdName').value = '';
    await refreshSharedData();
  });
}

function renderCategoriesTab(main){
  main.innerHTML = '<p class="planer-hint">Kategorie są wspólne z planerem obiadów — zmiana tutaj jest widoczna też tam.</p><div class="simple-list">' +
    (sharedCategories.length ? sharedCategories.map(c => (
      '<div class="simple-row" data-id="' + c.id + '">' +
        '<span class="row-label">' + escapeHtml(c.name) + '</span>' +
        '<input type="text" class="rename-input" value="' + escapeHtml(c.name) + '">' +
        '<button class="row-btn" data-rename="' + c.id + '" title="Zmień nazwę"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18 10a2.8 2.8 0 00-4-4L4 16v4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>' +
        '<button class="row-btn del" data-del="' + c.id + '"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>' +
      '</div>'
    )).join('') : '<div style="text-align:center;color:var(--text-soft);font-size:13px;padding:16px;">Lista pusta</div>') +
    '<div class="add-inline"><input type="text" id="manageAddInput" placeholder="Dodaj kategorię…"><button id="manageAddBtn">Dodaj</button></div>' +
  '</div>';
  wireSharedCategoryRows(main);
}
function wireSharedCategoryRows(main){
  main.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
    await updatePlanerRecord(record => { record.shoppingCategories = record.shoppingCategories.filter(c => c.id !== btn.dataset.del); });
    await refreshSharedData();
  }));
  main.querySelectorAll('[data-rename]').forEach(btn => btn.addEventListener('click', async () => {
    const row = btn.closest('.simple-row');
    if(!row.classList.contains('editing')){ row.classList.add('editing'); row.querySelector('.rename-input').focus(); return; }
    const newName = row.querySelector('.rename-input').value.trim();
    if(newName){
      await updatePlanerRecord(record => { const c = record.shoppingCategories.find(x => x.id === btn.dataset.rename); if(c) c.name = newName; });
      await refreshSharedData();
    }
    row.classList.remove('editing');
  }));
  const addBtn = document.getElementById('manageAddBtn');
  const input = document.getElementById('manageAddInput');
  const add = async () => {
    const name = input.value.trim();
    if(!name) return;
    input.value = '';
    await updatePlanerRecord(record => { record.shoppingCategories.push({ id: genId(), name }); });
    await refreshSharedData();
  };
  addBtn.addEventListener('click', add);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') add(); });
}

function renderStoresTab(main){
  main.innerHTML = '<div class="simple-list">' +
    (stores.length ? stores.map(s => (
      '<div class="simple-row" data-id="' + s.id + '">' +
        '<span class="row-label">' + escapeHtml(s.name) + '</span>' +
        '<input type="text" class="rename-input" value="' + escapeHtml(s.name) + '">' +
        '<button class="row-btn" data-rename="' + s.id + '" title="Zmień nazwę"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18 10a2.8 2.8 0 00-4-4L4 16v4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>' +
        '<button class="row-btn del" data-del="' + s.id + '"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>' +
      '</div>'
    )).join('') : '<div style="text-align:center;color:var(--text-soft);font-size:13px;padding:16px;">Lista pusta</div>') +
    '<div class="add-inline"><input type="text" id="manageAddInput" placeholder="Dodaj sklep…"><button id="manageAddBtn">Dodaj</button></div>' +
  '</div>';
  main.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => db.doc('stores/'+btn.dataset.del).delete()));
  main.querySelectorAll('[data-rename]').forEach(btn => btn.addEventListener('click', () => {
    const row = btn.closest('.simple-row');
    if(!row.classList.contains('editing')){ row.classList.add('editing'); row.querySelector('.rename-input').focus(); return; }
    const newName = row.querySelector('.rename-input').value.trim();
    if(newName) db.doc('stores/'+btn.dataset.rename).update({ name: newName });
    row.classList.remove('editing');
  }));
  const addBtn = document.getElementById('manageAddBtn');
  const input = document.getElementById('manageAddInput');
  const add = async () => {
    const name = input.value.trim();
    if(!name) return;
    input.value = '';
    await db.collection('stores').add({ name, createdAt: Date.now() });
  };
  addBtn.addEventListener('click', add);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') add(); });
}

init();
</script>
