<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nasze Apki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E8F1FC; --bg-grad: #F7FAFF; --surface: #FFFFFF; --surface-alt: #DCEAFB;
    --primary: #7FA9E0; --primary-deep: #4E74A8; --secondary: #F8DCE7;
    --lavender: #C6B4EA; --text: #3C4A5E; --text-soft: #7E90A6; --border: #DCE8F8;
    --shadow: rgba(90, 130, 180, 0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: 'Nunito', sans-serif; color: var(--text);
    background: radial-gradient(circle at 90% -5%, color-mix(in srgb, var(--secondary) 55%, transparent), transparent 45%),
                radial-gradient(circle at 8% 0%, var(--bg-grad), var(--bg) 55%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 20px;
  }
  h1 { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px; color: var(--primary-deep); margin: 14px 0 4px; text-align: center; }
  p.tagline { color: var(--text-soft); margin: 0 0 34px; text-align: center; font-size: 15px; }
  .brand-icon svg { width: 56px; height: 56px; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 18px; width: 100%; max-width: 380px; }
  @media (min-width: 640px) { .cards { grid-template-columns: 1fr 1fr; max-width: 640px; } }
  a.card {
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
    padding: 30px 22px; text-decoration: none; color: inherit;
    box-shadow: 0 6px 18px var(--shadow); transition: transform .15s ease;
  }
  a.card:hover { transform: translateY(-3px); }
  .card .emoji { font-size: 40px; }
  .card h2 { font-family: 'Fredoka', sans-serif; font-size: 19px; margin: 4px 0 2px; color: var(--text); }
  .card p { margin: 0; font-size: 13px; color: var(--text-soft); line-height: 1.5; }
  .card .go {
    margin-top: 10px; font-size: 12.5px; font-weight: 800; color: var(--primary-deep);
    background: var(--surface-alt); padding: 7px 16px; border-radius: 999px;
  }
  footer { margin-top: 40px; font-size: 12px; color: var(--text-soft); text-align: center; }
</style>
</head>
<body>
  <div class="brand-icon">
    <svg viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="24" fill="var(--secondary)"/>
      <path d="M10 41c0-9.5 6.3-15.5 14-15.5S38 31.5 38 41c0 2.2-1.8 3-4 3H14c-2.2 0-4-.8-4-3Z" fill="var(--primary)"/>
      <path d="M15 40.5c.3-6.3 4-10.5 9-10.5s8.7 4.2 9 10.5" stroke="var(--surface)" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
      <circle cx="18" cy="39.5" r="3.3" fill="var(--surface)"/>
      <circle cx="30" cy="39.5" r="3.3" fill="var(--surface)"/>
      <path d="M12.5 16c-2-5-1-8.6 1.3-9.6 3 1 5 4.8 3.8 9.6-.8 3-4.2 3-5.1 0Z" fill="var(--primary)"/>
      <path d="M35.5 16c2-5 1-8.6-1.3-9.6-3 1-5 4.8-3.8 9.6.8 3 4.2 3 5.1 0Z" fill="var(--primary)"/>
      <circle cx="24" cy="21.5" r="12" fill="var(--surface)"/>
      <circle cx="17.3" cy="24.5" r="2.2" fill="var(--secondary)" opacity="0.85"/>
      <circle cx="30.7" cy="24.5" r="2.2" fill="var(--secondary)" opacity="0.85"/>
      <circle cx="19.3" cy="20.5" r="1.7" fill="var(--text)"/>
      <circle cx="28.7" cy="20.5" r="1.7" fill="var(--text)"/>
      <ellipse cx="24" cy="25" rx="2" ry="1.4" fill="var(--primary-deep)"/>
      <path d="M24 26.2c-1.1 1.3-2.8 1.5-3.8.6M24 26.2c1.1 1.3 2.8 1.5 3.8.6" stroke="var(--text)" stroke-width="1" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>Nasze Apki</h1>
  <p class="tagline">Wybierz, co chcesz otworzyć</p>

  <div class="cards">
    <a class="card" href="planer-obiadow.html">
      <span class="emoji">🍲</span>
      <h2>Planer obiadów</h2>
      <p>Plan tygodnia, przepisy, lista zakupów i propozycje posiłków.</p>
      <span class="go">Otwórz →</span>
    </a>
    <a class="card" href="domowe-sprawy.html">
      <span class="emoji">🐾</span>
      <h2>Domowe Sprawy</h2>
      <p>Projekty, zadania, notatki, checklisty i kalendarz domowy.</p>
      <span class="go">Otwórz →</span>
    </a>
  </div>

  <footer>Wasza wspólna przestrzeń — zmiany widzą wszyscy, którzy otworzą stronę.</footer>
</body>
</html>
