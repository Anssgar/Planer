<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domowe Sprawy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E8F1FC; --bg-grad: #F7FAFF; --surface: #FFFFFF; --surface-alt: #DCEAFB;
    --column-bg: #F1F7FD; --primary: #7FA9E0; --primary-deep: #4E74A8; --secondary: #F8DCE7;
    --lavender: #C6B4EA; --lavender-deep: #9A81C9; --gold: #F3C25E; --gold-bg: #FCEAC0; --gold-text: #93701E;
    --text: #3C4A5E; --text-soft: #7E90A6; --border: #DCE8F8; --shadow: rgba(90, 130, 180, 0.14);
    --done-bg: #E1F0E4; --done-text: #4C7A55; --danger: #D97B7B; --danger-bg: #F9DCDC;
  }

  * { box-sizing: border-box; }
  button, input, textarea, select { font-family: inherit; color: inherit; }
  body {
    margin: 0; font-family: 'Nunito', sans-serif;
    background: radial-gradient(circle at 90% -5%, color-mix(in srgb, var(--secondary) 55%, transparent), transparent 45%),
                radial-gradient(circle at 8% 0%, var(--bg-grad), var(--bg) 55%);
    color: var(--text); min-height: 100vh; padding-bottom: 60px;
  }
  h1, h2, h3, .display { font-family: 'Fredoka', sans-serif; }

  header.top { padding: 20px 20px 8px; max-width: 1100px; margin: 0 auto; }
  .brand-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { margin: 0; font-size: 24px; font-weight: 600; color: var(--primary-deep); }
  .brand svg { width: 36px; height: 36px; flex-shrink: 0; }
  .tagline { margin: 2px 0 0; color: var(--text-soft); font-size: 13.5px; }
  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-round-btn {
    width: 38px; height: 38px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border);
    color: var(--primary-deep); display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-round-btn:hover { background: var(--surface-alt); }
  .icon-round-btn svg { width: 18px; height: 18px; }

  .reminder-banner {
    max-width: 1100px; margin: 14px auto 0; padding: 12px 16px; background: var(--surface-alt);
    border: 1px solid var(--border); border-radius: 16px; display: none; gap: 10px; align-items: flex-start;
  }
  .reminder-banner.show { display: flex; }
  .reminder-banner svg { width: 22px; flex-shrink: 0; margin-top: 2px; }
  .reminder-banner b { color: var(--primary-deep); }
  .reminder-list { font-size: 13.5px; color: var(--text-soft); margin-top: 3px; line-height: 1.5; }

  .projects-row {
    max-width: 1100px; margin: 16px auto 0; padding: 0 20px; display: flex; gap: 8px;
    overflow-x: auto; scrollbar-width: thin;
  }
  .proj-tab {
    flex-shrink: 0; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-soft); font-weight: 700; font-size: 14px;
    cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  .proj-tab:hover { background: var(--surface-alt); }
  .proj-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
  .proj-tab.add { background: transparent; border-style: dashed; color: var(--primary-deep); }
  .proj-tab svg { width: 15px; height: 15px; }

  .breadcrumb {
    max-width: 1100px; margin: 12px auto 0; padding: 0 20px; display: flex; align-items: center; gap: 8px;
  }
  .breadcrumb button.back {
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px 6px 8px;
    color: var(--primary-deep); font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .breadcrumb button.back svg { width: 15px; height: 15px; }
  .breadcrumb .crumb-title { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; color: var(--text); }

  .sub-nav { max-width: 1100px; margin: 12px auto 0; padding: 0 20px; display: flex; gap: 6px; overflow-x: auto; }
  .sub-tab {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 12px;
    border: none; background: transparent; color: var(--text-soft); font-weight: 700; font-size: 13.5px; cursor: pointer;
  }
  .sub-tab svg { width: 15px; height: 15px; }
  .sub-tab.active { background: var(--surface); color: var(--primary-deep); box-shadow: 0 2px 8px var(--shadow); }

  main { max-width: 1100px; margin: 16px auto 0; padding: 0 20px; }

  .empty-state { text-align: center; padding: 46px 20px; color: var(--text-soft); }
  .empty-state svg { width: 110px; margin-bottom: 6px; }
  .empty-state h2 { color: var(--primary-deep); margin: 6px 0 4px; font-size: 19px; }
  .empty-state p.small { font-size: 13.5px; }
  .empty-state button { margin-top: 14px; }

  /* ---- Dashboard ---- */
  .dash-grid { display: grid; gap: 16px; }
  .dash-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px 18px;
  }
  .dash-card h3 { margin: 0 0 10px; font-size: 16px; color: var(--primary-deep); display: flex; align-items: center; gap: 7px; }
  .dash-card h3 svg { width: 18px; height: 18px; }
  .quicknote-preview {
    font-size: 13.5px; color: var(--text-soft); line-height: 1.5; max-height: 60px; overflow: hidden;
    margin-bottom: 10px;
  }
  .dash-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .dash-row:last-child { border-bottom: none; }
  .dash-row:hover { background: var(--column-bg); border-radius: 10px; }
  .dash-row .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dash-row .dot.high { background: var(--danger); }
  .dash-row .dot.medium { background: var(--gold); }
  .dash-row .dot.low { background: var(--text-soft); }
  .dash-row .info { flex: 1; min-width: 0; }
  .dash-row .info .t { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dash-row .info .p { font-size: 12px; color: var(--text-soft); }
  .stats-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat-pill { background: var(--column-bg); border-radius: 14px; padding: 10px 14px; text-align: center; flex: 1; min-width: 90px; }
  .stat-pill .n { font-family: 'Fredoka', sans-serif; font-size: 22px; color: var(--primary-deep); font-weight: 600; }
  .stat-pill .l { font-size: 11.5px; color: var(--text-soft); font-weight: 700; }

  /* ---- Section cards ---- */
  .section-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .section-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px;
    cursor: pointer; box-shadow: 0 3px 10px var(--shadow);
  }
  .section-card:hover { transform: translateY(-2px); }
  .section-card .emoji { font-size: 26px; }
  .section-card h3 { margin: 8px 0 4px; font-size: 16px; }
  .section-card .counts { font-size: 12px; color: var(--text-soft); }
  .section-card.add-card {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border-style: dashed; color: var(--primary-deep); font-weight: 700; box-shadow: none;
  }
  .section-card.add-card svg { width: 26px; height: 26px; }

  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 760px) { .board { grid-template-columns: 1fr; } }
  .column { background: var(--column-bg); border-radius: 20px; padding: 14px; min-height: 160px; border: 1px solid var(--border); }
  .column.dragover { outline: 2px dashed var(--primary); outline-offset: -6px; }
  .col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
  .col-head h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--text); }
  .col-count { background: var(--surface); border-radius: 999px; font-size: 12px; font-weight: 800; padding: 2px 9px; color: var(--text-soft); }

  .card { background: var(--surface); border-radius: 16px; padding: 12px 13px; margin-bottom: 10px; box-shadow: 0 3px 10px var(--shadow); cursor: grab; }
  .card:active { cursor: grabbing; }
  .card.done { opacity: 0.75; }
  .card-title { font-weight: 700; font-size: 14.5px; margin: 0 0 8px; line-height: 1.35; }
  .card.done .card-title { text-decoration: line-through; color: var(--text-soft); }
  .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .due-badge { font-size: 11.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--surface-alt); color: var(--text-soft); }
  .due-badge.overdue { background: var(--danger-bg); color: var(--danger); }
  .due-badge.today { background: var(--gold-bg); color: var(--gold-text); }
  .priority-badge { font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
  .priority-badge.high { background: var(--danger-bg); color: var(--danger); }
  .priority-badge.medium { background: var(--gold-bg); color: var(--gold-text); }
  .priority-badge.low { background: var(--surface-alt); color: var(--text-soft); }
  .priority-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .gcal-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; color: var(--primary-deep); text-decoration: none; margin-top: 10px; }
  .gcal-link svg { width: 14px; height: 14px; }

  .fab {
    position: fixed; right: 18px; bottom: 20px; width: 52px; height: 52px; min-width: 52px; min-height: 52px;
    max-width: 52px; max-height: 52px; border-radius: 50%; padding: 0; box-sizing: border-box;
    background: var(--primary); color: white; border: none; font-size: 26px; line-height: 1;
    box-shadow: 0 4px 14px var(--shadow); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 20;
  }
  .fab:hover { background: var(--primary-deep); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(40, 60, 90, 0.28); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  @media (min-width: 620px) { .modal-overlay { align-items: center; } }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); width: 100%; max-width: 460px; border-radius: 22px 22px 0 0; padding: 22px 20px 26px; max-height: 88vh; overflow-y: auto; }
  @media (min-width: 620px) { .modal { border-radius: 22px; } }
  .modal.wide { max-width: 640px; }
  .modal h2 { margin: 0 0 16px; color: var(--primary-deep); font-size: 20px; }
  label { display: block; font-size: 12.5px; font-weight: 800; color: var(--text-soft); margin: 14px 0 5px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=date], input[type=url], select, textarea {
    width: 100%; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit; font-size: 14.5px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  .seg { display: flex; gap: 8px; margin-top: 2px; }
  .seg button {
    flex: 1; padding: 9px 6px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--text-soft); font-weight: 700; font-size: 13.5px; cursor: pointer;
  }
  .seg button.active.p1 { background: var(--primary); border-color: var(--primary); color: white; }
  .seg button.active.p2 { background: var(--lavender); border-color: var(--lavender); color: white; }
  .seg button.active.status { background: var(--primary); border-color: var(--primary); color: white; }
  .seg button.active.pri-low { background: var(--text-soft); border-color: var(--text-soft); color: white; }
  .seg button.active.pri-medium { background: var(--gold); border-color: var(--gold); color: white; }
  .seg button.active.pri-high { background: var(--danger); border-color: var(--danger); color: white; }

  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  button.primary { flex: 1; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 14px; font-weight: 800; font-size: 15px; cursor: pointer; font-family: inherit; }
  button.primary:hover { background: var(--primary-deep); }
  button.ghost { background: none; border: 1.5px solid var(--border); color: var(--text-soft); padding: 12px 16px; border-radius: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  button.text-danger { color: var(--danger); background: none; border: none; font-weight: 700; cursor: pointer; font-size: 13.5px; padding: 8px; }

  .notes-toolbar { display: flex; gap: 6px; margin-bottom: 10px; background: var(--surface); padding: 6px; border-radius: 14px; border: 1px solid var(--border); flex-wrap: wrap; }
  .notes-toolbar button { background: var(--column-bg); border: 1px solid var(--border); border-radius: 9px; width: 34px; height: 34px; cursor: pointer; color: var(--text); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; }
  .notes-toolbar button:hover { background: var(--surface-alt); }
  .notes-editor { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px; min-height: 220px; font-size: 15px; line-height: 1.6; outline: none; }
  .notes-editor:empty::before { content: attr(data-placeholder); color: var(--text-soft); }
  .notes-editor h3 { font-family: 'Fredoka', sans-serif; color: var(--primary-deep); margin: 14px 0 6px; }
  .notes-editor ul, .notes-editor ol { padding-left: 22px; margin: 8px 0; }
  .save-hint { text-align: right; font-size: 11.5px; color: var(--text-soft); margin-top: 6px; }

  .simple-list { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 8px; }
  .simple-row { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  .simple-row:last-child { border-bottom: none; }
  .simple-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--primary); flex-shrink: 0; cursor: pointer; }
  .simple-row .row-label { flex: 1; font-weight: 600; font-size: 14.5px; }
  .simple-row.checked .row-label { text-decoration: line-through; color: var(--text-soft); }
  .simple-row a.row-label { color: var(--primary-deep); text-decoration: none; word-break: break-all; }
  .simple-row a.row-label:hover { text-decoration: underline; }
  .row-del { background: none; border: none; color: var(--text-soft); cursor: pointer; padding: 4px; flex-shrink: 0; }
  .row-del:hover { color: var(--danger); }
  .row-del svg { width: 16px; height: 16px; }
  .add-inline { display: flex; gap: 8px; padding: 10px 6px 4px; flex-wrap: wrap; }
  .add-inline input { flex: 1; min-width: 120px; }
  .add-inline button { background: var(--primary); color: white; border: none; border-radius: 10px; padding: 0 16px; font-weight: 800; cursor: pointer; font-family: inherit; }

  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .photo-tile { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 1; background: var(--surface-alt); border: 1px solid var(--border); }
  .photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-del { position: absolute; top: 6px; right: 6px; background: rgba(20,20,30,0.55); border: none; color: white; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .photo-del svg { width: 14px; height: 14px; }
  .upload-tile { aspect-ratio: 1; border-radius: 16px; border: 2px dashed var(--border); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-soft); cursor: pointer; font-size: 12px; font-weight: 700; }
  .upload-tile:hover { background: var(--surface-alt); }
  .upload-tile svg { width: 26px; height: 26px; }

  .backup-list button.backup-opt {
    width: 100%; display: flex; align-items: center; gap: 12px; background: var(--column-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; font-family: inherit; text-align: left;
  }
  .backup-opt svg { width: 20px; height: 20px; color: var(--primary-deep); flex-shrink: 0; }
  .backup-opt .bo-title { font-weight: 800; font-size: 14px; color: var(--text); }
  .backup-opt .bo-sub { font-size: 11.5px; color: var(--text-soft); }
  .backup-opt:hover { background: var(--surface-alt); }

  .crumb-title.editable { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .crumb-title.editable svg { width: 13px; height: 13px; color: var(--text-soft); }
  .mini-due { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--surface-alt); color: var(--text-soft); }
  .mini-due.overdue { background: var(--danger-bg); color: var(--danger); }
  .mini-due.today { background: var(--gold-bg); color: var(--gold-text); }

  .section-card { position: relative; }
  .section-edit-btn {
    position: absolute; top: 10px; right: 10px; background: var(--column-bg); border: 1px solid var(--border);
    border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-soft);
  }
  .section-edit-btn svg { width: 13px; height: 13px; }
  .section-card .counts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .task-photo-wrap img { width: 90px; height: 90px; object-fit: cover; border-radius: 14px; border: 1px solid var(--border); display: block; }
  .task-photo-tile { position: relative; width: 90px; }
  .task-photo-remove {
    position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--danger); color: white; border: none; cursor: pointer; font-size: 13px; line-height: 1;
  }
  .row-thumb { width: 28px; height: 28px; border-radius: 8px; object-fit: cover; cursor: pointer; flex-shrink: 0; }
  .row-photo-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 4px; flex-shrink: 0; color: var(--text-soft); }
  .row-photo-btn:hover { color: var(--primary-deep); }

  .notes-editor img { max-width: 100%; border-radius: 12px; margin: 8px 0; display: block; }

  .lightbox-content { background: transparent; box-shadow: none; padding: 0; max-width: 92vw; }
  .lightbox-content img { max-width: 92vw; max-height: 80vh; border-radius: 16px; display: block; margin: 0 auto; }
  .hidden-file-input { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* ---- Calendar ---- */
  .cal-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .cal-nav { display: flex; align-items: center; gap: 6px; }
  .cal-nav button.arrow { background: var(--surface); border: 1px solid var(--border); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; color: var(--primary-deep); display: flex; align-items: center; justify-content: center; }
  .cal-nav button.arrow svg { width: 15px; height: 15px; }
  .cal-title { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; min-width: 150px; text-align: center; }
  .cal-today-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; color: var(--primary-deep); cursor: pointer; }
  .cal-mode-seg { display: flex; gap: 4px; background: var(--column-bg); border-radius: 12px; padding: 4px; }
  .cal-mode-seg button { border: none; background: transparent; padding: 6px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: var(--text-soft); cursor: pointer; }
  .cal-mode-seg button.active { background: var(--surface); color: var(--primary-deep); box-shadow: 0 2px 6px var(--shadow); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { text-align: center; font-size: 11px; font-weight: 800; color: var(--text-soft); padding-bottom: 4px; }
  .cal-day { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 6px; min-height: 68px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .cal-day.outside { opacity: 0.35; }
  .cal-day.today { border-color: var(--primary); border-width: 2px; }
  .cal-day .num { font-size: 12px; font-weight: 800; color: var(--text); }
  .cal-chip { font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 6px; background: var(--surface-alt); color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-chip.high { background: var(--danger-bg); color: var(--danger); }
  .cal-chip.medium { background: var(--gold-bg); color: var(--gold-text); }
  .cal-chip-more { font-size: 9.5px; color: var(--text-soft); font-weight: 700; }
  .cal-week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-week-col { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px; min-height: 140px; }
  .cal-week-col.today { border-color: var(--primary); border-width: 2px; }
  .cal-week-col .dow-label { font-size: 11px; font-weight: 800; color: var(--text-soft); margin-bottom: 6px; }
  .cal-day-list { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 6px; }
  .cal-item-row { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .cal-item-row:last-child { border-bottom: none; }
  .cal-item-row:hover { background: var(--column-bg); }
  .cal-item-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cal-item-row .dot.high { background: var(--danger); } .cal-item-row .dot.medium { background: var(--gold); } .cal-item-row .dot.low { background: var(--text-soft); }
  .cal-item-row .info { flex: 1; min-width: 0; }
  .cal-item-row .info .t { font-weight: 700; font-size: 14px; }
  .cal-item-row .info .p { font-size: 11.5px; color: var(--text-soft); }

  .ai-btn {
    display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, var(--primary), var(--lavender));
    color: white; border: none; border-radius: 12px; padding: 9px 14px; font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .ai-btn:hover { filter: brightness(1.06); }
  .ai-btn:disabled { opacity: 0.6; cursor: default; }
  .ai-btn svg { width: 15px; height: 15px; }
  .task-tab-bar { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
  .task-tab-bar button { flex-shrink: 0; padding: 7px 12px; border-radius: 10px; border: none; background: var(--column-bg); color: var(--text-soft); font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .task-tab-bar button.active { background: var(--primary); color: white; }

  #printArea { display: none; }
  .emoji-picker-trigger { font-size: 24px; text-align: center; cursor: pointer; background: var(--bg); }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .emoji-grid button {
    font-size: 22px; width: 46px; height: 46px; border-radius: 13px; border: 1.5px solid var(--border);
    background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .emoji-grid button:hover { background: var(--surface-alt); border-color: var(--primary); }
  @media print {
    body.printing > *:not(#printArea) { display: none !important; }
    body.printing #printArea { display: block !important; }
    #printArea h1 { font-family: sans-serif; }
    #printArea table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    #printArea th, #printArea td { border: 1px solid #ccc; padding: 5px 8px; font-size: 12px; text-align: left; }
  }

  ::selection { background: var(--secondary); }
</style>

function pad(n){ return String(n).padStart(2,'0'); }

function dueClass(dateStr, status){

function formatDue(dateStr){

function gcalUrl(title, dueDate, details){
  if(!dueDate) return null;
  const start = dueDate.replace(/-/g,'');
  const d = new Date(dueDate + 'T00:00:00'); d.setDate(d.getDate()+1);
  const end = d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const params = new URLSearchParams({ action: 'TEMPLATE', text: title, dates: start + '/' + end, details: details || '' });
  return 'https://calendar.google.com/calendar/render?' + params.toString();

function getCollectionOnce(path){

function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function getEditorSelectionRange(editor){
  const sel = window.getSelection();
  if(sel && sel.rangeCount > 0){
    const r = sel.getRangeAt(0);
    if(editor.contains(r.commonAncestorContainer)) return r.cloneRange();
  }
  const r = document.createRange();
  r.selectNodeContents(editor);
  r.collapse(false);
  return r;
}
function insertNodeAtSavedRange(editor, range, node){
  editor.focus();
  try {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    range.deleteContents();
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  } catch(e){
    editor.appendChild(node);
  }
}
function cycleImageSize(img){
  const sizes = ['33%', '60%', '100%'];
  const cur = img.dataset.size || '100%';
  const idx = sizes.indexOf(cur);
  const next = sizes[(idx + 1) % sizes.length];
  img.style.width = next;
  img.style.height = 'auto';
  img.dataset.size = next;
}
function wireImageResize(editor, onSave){
  editor.addEventListener('click', e => {
    const img = e.target.closest('img');
    if(img && editor.contains(img)){
      cycleImageSize(img);
      onSave();
    }
  });
}
function runEditorCommand(cmd, editor, onDone){
  if(cmd === 'h3') document.execCommand('formatBlock', false, 'H3');
  else if(cmd === 'ul') document.execCommand('insertUnorderedList');
  else if(cmd === 'ol') document.execCommand('insertOrderedList');
  else if(cmd === 'fontsmall' || cmd === 'fontnormal' || cmd === 'fontlarge'){
    try { document.execCommand('styleWithCSS', false, true); } catch(e){}
    document.execCommand('fontSize', false, cmd === 'fontsmall' ? '2' : cmd === 'fontlarge' ? '5' : '3');
  } else if(cmd === 'image'){
    const savedRange = getEditorSelectionRange(editor);
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.className = 'hidden-file-input';
    document.body.appendChild(input);
    input.onchange = async () => {
      const file = input.files[0];
      input.remove();
      if(!file) return;

        insertNodeAtSavedRange(editor, savedRange, img);
        onDone();
      } catch(e){ console.error(e); alert('Nie udało się wstawić zdjęcia.'); }
    };
    input.click();
    return;
  } else document.execCommand(cmd);
  onDone();
}

function createJsonBinDb(){
  let state = jsonbinEmptyState();
  let pendingSave = false;
  let saveTimer = null;
  const collectionListeners = {};
  const docListeners = {};

  function notifyCollection(name){
    const set = collectionListeners[name];
    if(!set) return;
    set.forEach(entry => {
      let ids = Object.keys(state[name] || {});
      if(entry.orderField){
        ids.sort((a,b) => {
          const av = (state[name][a]||{})[entry.orderField], bv = (state[name][b]||{})[entry.orderField];
          if(av === bv) return 0;
          if(av === undefined) return entry.orderDir === 'desc' ? 1 : -1;
          if(bv === undefined) return entry.orderDir === 'desc' ? -1 : 1;
          return entry.orderDir === 'desc' ? (av < bv ? 1 : -1) : (av > bv ? 1 : -1);
        });
      }
      const docs = ids.map(id => ({ id, data: () => state[name][id] }));
      entry.cb({ docs });
    });
  }
  function notifyDoc(path){
    const set = docListeners[path];
    if(!set) return;
    const [coll, id] = path.split('/');
    const data = state[coll] && state[coll][id];
    set.forEach(cb => cb({ exists: !!data, data: () => data }));
  }
  function notifyAll(){
    Object.keys(collectionListeners).forEach(notifyCollection);
    Object.keys(docListeners).forEach(notifyDoc);
  }

  async function ensureBin(){
    if(JSONBIN_BIN_ID) return true;
    try {
      const res = await fetch(JSONBIN_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY, 'X-Bin-Name': 'domowe-sprawy' },
        body: JSON.stringify(jsonbinEmptyState())
      });
      const json = await res.json();
      if(json && json.metadata && json.metadata.id){
        JSONBIN_BIN_ID = json.metadata.id;
        showBinIdBanner(JSONBIN_BIN_ID);
        return true;
      }
    } catch(e){ console.error('jsonbin create error', e); }
    return false;
  }
  async function pullRemote(){
    try {
      const res = await fetch(`${JSONBIN_BASE}/${JSONBIN_BIN_ID}/latest`, { headers: { 'X-Master-Key': JSONBIN_API_KEY } });
      if(!res.ok) return;
      const json = await res.json();
      if(pendingSave) return;
      const nextState = Object.assign(jsonbinEmptyState(), json.record || {});
      if(JSON.stringify(nextState) === JSON.stringify(state)) return;
      state = nextState;
      notifyAll();
    } catch(e){ console.error('jsonbin pull error', e); }
  }
  function schedulePush(){
    pendingSave = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        await fetch(`${JSONBIN_BASE}/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
          body: JSON.stringify(state)
        });
      } catch(e){ console.error('jsonbin push error', e); }
      pendingSave = false;
    }, 350);
  }

  function docRef(coll, id){
    const path = coll + '/' + id;
    return {
      onSnapshot(cb){
        if(!docListeners[path]) docListeners[path] = new Set();
        docListeners[path].add(cb);
        const data = state[coll] && state[coll][id];
        cb({ exists: !!data, data: () => data });
        return () => docListeners[path].delete(cb);
      },
      async set(data){
        if(!state[coll]) state[coll] = {};
        state[coll][id] = { ...data };
        notifyDoc(path); notifyCollection(coll); schedulePush();
      },
      async update(patch){
        if(!state[coll]) state[coll] = {};
        state[coll][id] = { ...(state[coll][id]||{}), ...patch };
        notifyDoc(path); notifyCollection(coll); schedulePush();
      },
      async delete(){
        if(state[coll]) delete state[coll][id];
        notifyDoc(path); notifyCollection(coll); schedulePush();
      }
    };
  }
  function collectionRef(name, orderField, orderDir){
    return {
      orderBy(field, dir){ return collectionRef(name, field, dir || 'asc'); },
      onSnapshot(cb){
        const entry = { cb, orderField, orderDir };
        if(!collectionListeners[name]) collectionListeners[name] = new Set();
        collectionListeners[name].add(entry);
        notifyCollection(name);
        return () => collectionListeners[name].delete(entry);
      },
      async add(data){
        const id = genId();
        if(!state[name]) state[name] = {};
        state[name][id] = { ...data };
        notifyCollection(name); schedulePush();
        return { id };
      }
    };
  }

  (async () => {
    if(!JSONBIN_API_KEY){ showJsonbinConfigWarning('Uzupełnij stałą <code>JSONBIN_API_KEY</code> na górze pliku (Twój klucz z jsonbin.io) i odśwież stronę.'); return; }
    const ok = await ensureBin();
    if(!ok){ showJsonbinConfigWarning('Nie udało się połączyć z jsonbin.io — sprawdź klucz API i połączenie z internetem.'); return; }
    await pullRemote();
    setInterval(pullRemote, JSONBIN_POLL_MS);
  })();

  return {
    doc(path){ const [coll, id] = path.split('/'); return docRef(coll, id); },
    collection(name){ return collectionRef(name); }
  };
}

}

function daysLeftLabel(due){
  if(!due) return '';
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(due + 'T00:00:00');
  const diff = Math.round((d - now) / 86400000);
  if(diff === 0) return 'dziś';
  if(diff === 1) return 'jutro';
  if(diff === -1) return 'wczoraj';
  if(diff > 1) return `za ${diff} dni`;
  return `${Math.abs(diff)} dni temu`;
}
function dashRowHtml(x, mode){
  const dc = dueClass(x.due, '');
  const icon = x.kind === 'project' ? '📁 ' : x.kind === 'section' ? '📂 ' : '';
  const rightBadge = mode === 'priority'
    ? `<span class="priority-badge ${x.priority||'medium'}"><span class="dot"></span>${PRIORITY_LABEL[x.priority||'medium']}</span>`
    : `<span class="due-badge ${dc}">${daysLeftLabel(x.due)}</span>`;
  return `<div class="dash-row" data-id="${x.id}" data-kind="${x.kind}">
    <span class="dot ${x.priority||(x.kind==='task'?'medium':'low')}"></span>
    <div class="info"><div class="t">${icon}${escapeHtml(x.title)}</div><div class="p">${escapeHtml(x.loc)}</div></div>
    ${rightBadge}
  </div>`;
}

  }
}

// ---- Calendar ----
function collectCalendarItems(){
  const items = [];
  tasks.forEach(t => { if(t.due) items.push({ kind: 'task', id: t.id, title: t.title, due: t.due, priority: t.priority, status: t.status, loc: [projectName(t.projectId), sectionName(t.sectionId)].filter(Boolean).join(' › '), projectId: t.projectId, sectionId: t.sectionId }); });
  projects.forEach(p => { if(p.due) items.push({ kind: 'project', id: p.id, title: p.name, due: p.due, priority: null, loc: 'Projekt', projectId: p.id }); });
  sections.forEach(s => { if(s.due) items.push({ kind: 'section', id: s.id, title: s.name, due: s.due, priority: null, loc: 'Podzadanie · ' + projectName(s.projectId), projectId: s.projectId, sectionId: s.id }); });
  return items;
}
function calItemsForDate(items, dateStr){ return items.filter(x => x.due === dateStr); }
function navigateToCalItem(x){
  if(x.kind === 'task'){
    currentProjectId = x.projectId; currentSectionId = x.sectionId;
    renderProjectsRow();
    goToTaskPage(x.id);
  } else if(x.kind === 'project'){
    currentProjectId = x.id; currentSectionId = null; activeView = 'sections';
    renderProjectsRow(); renderBreadcrumb(); renderSubNav(); renderMain();
  } else if(x.kind === 'section'){
    currentProjectId = x.projectId; currentSectionId = x.id; activeView = 'section'; currentSubTab = 'tasks';
    renderProjectsRow(); renderBreadcrumb(); renderSubNav(); renderMain();
  }
}
function calMonthLabel(d){ const months=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień']; return months[d.getMonth()] + ' ' + d.getFullYear(); }
function calMondayIndex(jsDay){ return (jsDay + 6) % 7; } // Monday=0
function renderCalendar(main){
  const items = collectCalendarItems();
  const t = todayStr();
  let header = `<div class="cal-header">
    <div class="cal-nav">
      <button class="arrow" id="calPrevBtn">${ICONS.chevleft}</button>
      <span class="cal-title" id="calTitle"></span>
      <button class="arrow" id="calNextBtn">${ICONS.chevright}</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button class="cal-today-btn" id="calTodayBtn">Dziś</button>
      <div class="cal-mode-seg">
        <button data-mode="month" class="${calMode==='month'?'active':''}">Miesiąc</button>
        <button data-mode="week" class="${calMode==='week'?'active':''}">Tydzień</button>
        <button data-mode="day" class="${calMode==='day'?'active':''}">Dzień</button>
      </div>
    </div>
  </div>`;
  let body = '';
  if(calMode === 'month'){
    const y = calDate.getFullYear(), m = calDate.getMonth();
    const first = new Date(y, m, 1);
    const startOffset = calMondayIndex(first.getDay());
    const gridStart = new Date(y, m, 1 - startOffset);
    const dows = ['Pon','Wt','Śr','Czw','Pt','Sob','Nd'];
    body += '<div class="cal-grid">' + dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
    for(let i=0;i<42;i++){
      const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
      const ds = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
      const outside = d.getMonth() !== m;
      const dayItems = calItemsForDate(items, ds);
      body += `<div class="cal-day ${outside?'outside':''} ${ds===t?'today':''}" data-date="${ds}">
        <span class="num">${d.getDate()}</span>
        ${dayItems.slice(0,2).map(x => `<span class="cal-chip ${x.priority||''}">${escapeHtml(x.title)}</span>`).join('')}
        ${dayItems.length>2 ? `<span class="cal-chip-more">+${dayItems.length-2} więcej</span>` : ''}
      </div>`;
    }
    body += '</div>';
  } else if(calMode === 'week'){
    const startOffset = calMondayIndex(calDate.getDay());
    const weekStart = new Date(calDate); weekStart.setDate(calDate.getDate()-startOffset);
    const dows = ['Pon','Wt','Śr','Czw','Pt','Sob','Nd'];
    body += '<div class="cal-week-grid">';
    for(let i=0;i<7;i++){
      const d = new Date(weekStart); d.setDate(weekStart.getDate()+i);
      const ds = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
      const dayItems = calItemsForDate(items, ds);
      body += `<div class="cal-week-col ${ds===t?'today':''}" data-date="${ds}">
        <div class="dow-label">${dows[i]} ${d.getDate()}</div>
        ${dayItems.map(x => `<span class="cal-chip ${x.priority||''}" style="display:block;margin-bottom:4px;">${escapeHtml(x.title)}</span>`).join('') || ''}
      </div>`;
    }
    body += '</div>';
  } else {
    const ds = calDate.getFullYear()+'-'+pad(calDate.getMonth()+1)+'-'+pad(calDate.getDate());
    const dayItems = calItemsForDate(items, ds);
    body += `<div class="cal-day-list">${dayItems.length ? dayItems.map(x => calItemRowHtml(x)).join('') : '<div style="text-align:center;color:var(--text-soft);font-size:13px;padding:20px;">Brak terminów tego dnia ' + PAW + '</div>'}</div>`;
  }
  main.innerHTML = header + body;
  document.getElementById('calTitle').textContent = calMode === 'month' ? calMonthLabel(calDate)
    : calMode === 'week' ? 'Tydzień · ' + calMonthLabel(calDate)
    : calDate.toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('calPrevBtn').addEventListener('click', () => { calShift(-1); });
  document.getElementById('calNextBtn').addEventListener('click', () => { calShift(1); });

function handlePhotoUpload(e){
  const file = e.target.files[0]; e.target.value = '';
  if(!file || !currentSectionId) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = async () => {
      const maxDim = 900; let { width, height } = img;
      if(width > maxDim || height > maxDim){
        if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.68);
      try { await db.collection('photos').add({ data: dataUrl, sectionId: currentSectionId, createdAt: Date.now() }); }
      catch(err){ console.error(err); alert('Nie udało się zapisać zdjęcia — spróbuj mniejszego pliku.'); }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function renderReminders(){
  const t = todayStr();
  const relevant = tasks.filter(x => x.status !== 'done' && x.due && x.due <= t);
  const dueProjects = projects.filter(p => p.due && p.due <= t);
  const dueSections = sections.filter(s => s.due && s.due <= t);
  const banner = document.getElementById('reminderBanner');
  const list = document.getElementById('reminderList'); const title = document.getElementById('reminderTitle');
  const totalCount = relevant.length + dueProjects.length + dueSections.length;
  if(!totalCount){ banner.classList.remove('show'); return; }
  banner.classList.add('show');
  const overdue = relevant.filter(x => x.due < t).length + dueProjects.filter(x=>x.due<t).length + dueSections.filter(x=>x.due<t).length;
  const today = totalCount - overdue;
  const parts = [];
  if(overdue) parts.push(overdue + ' zaległ' + (overdue===1?'e':'ych'));
  if(today) parts.push(today + ' na dziś');
  title.textContent = 'Masz terminy: ' + parts.join(', ');
  const lines = [
    ...relevant.slice(0,5).map(x => escapeHtml(x.title) + ' · ' + escapeHtml(projectName(x.projectId))),
    ...dueProjects.slice(0,3).map(p => '📁 Projekt: ' + escapeHtml(p.name)),
    ...dueSections.slice(0,3).map(s => '📂 Podzadanie: ' + escapeHtml(s.name) + ' · ' + escapeHtml(projectName(s.projectId)))
  ];
  list.innerHTML = lines.slice(0,6).join('<br>');
  try {
    if('Notification' in window && Notification.permission === 'granted'){
      relevant.forEach(x => {
        const key = x.id + '_' + t;
        if(!notifiedToday.has(key)){ notifiedToday.add(key); new Notification('Domowe Sprawy — przypomnienie', { body: x.title + (x.due < t ? ' (zaległe)' : ' (termin dziś)') }); }
      });
    }
  } catch(e){}
}

function handleImportFile(e){
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const data = JSON.parse(ev.target.result);
      const writes = [];
      (data.projects||[]).forEach(p => writes.push(db.doc('projects/'+p.id).set(p)));
      (data.sections||[]).forEach(s => writes.push(db.doc('sections/'+s.id).set(s)));
      (data.tasks||[]).forEach(t => writes.push(db.doc('tasks/'+t.id).set(t)));
      (data.checklist||[]).forEach(c => writes.push(db.doc('checklist/'+c.id).set(c)));
      (data.links||[]).forEach(l => writes.push(db.doc('links/'+l.id).set(l)));
      (data.photos||[]).forEach(p => writes.push(db.doc('photos/'+p.id).set(p)));
      (data.notes||[]).forEach(n => writes.push(db.doc('notes/'+n.id).set({ html: n.html||'', updatedAt: Date.now() })));
      (data.taskNotes||[]).forEach(n => writes.push(db.doc('tasknotes/'+n.id).set({ html: n.html||'', updatedAt: Date.now() })));
      if(Array.isArray(data.quickNotes)) data.quickNotes.forEach(n => writes.push(db.doc('quicknotes/'+n.id).set({ title: n.title||'', html: n.html||'', createdAt: n.createdAt||Date.now(), updatedAt: Date.now() })));
      if(data.settings) writes.push(db.doc('meta/settings').set(data.settings));
      await Promise.all(writes);
      alert('Kopia zapasowa została wczytana.');
      document.getElementById('backupModalOverlay').classList.remove('show');
    } catch(err){ console.error(err); alert('Nie udało się wczytać pliku — sprawdź, czy to poprawna kopia zapasowa z tej aplikacji.'); }
  };
  reader.readAsText(file);
}

function buildReportRows(){
  const rows = [];
  projects.forEach(p => {
    const projSections = sections.filter(s => s.projectId === p.id);
    const secList = projSections.length ? projSections : [{ id: null, name: '(bez podzadania)' }];
    secList.forEach(s => {
      const secTasks = tasks.filter(t => t.projectId === p.id && t.sectionId === s.id);
      secTasks.forEach(t => {
        rows.push({
          Projekt: p.name, Podzadanie: s.name, Zadanie: t.title, Osoba: personName(t.person),
          Termin: t.due || '', Priorytet: PRIORITY_LABEL[t.priority] || '', Status: STATUS_LABEL[t.status] || t.status
        });
      });
      if(!secTasks.length) rows.push({ Projekt: p.name, Podzadanie: s.name, Zadanie: '(brak zadań)', Osoba: '', Termin: '', Priorytet: '', Status: '' });
    });
  });
  return rows;
}

async function exportExcel(){
  try {
    if(typeof XLSX === 'undefined'){ alert('Nie udało się załadować biblioteki Excela — sprawdź połączenie i spróbuj ponownie.'); return; }
    const rows = buildReportRows();
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Zadania');
    const checklistRows = checklistItems.map(c => ({ Podzadanie: sectionName(c.sectionId), Pozycja: c.label, Zaznaczone: c.checked ? 'tak' : 'nie' }));
    if(checklistRows.length){ const ws2 = XLSX.utils.json_to_sheet(checklistRows); XLSX.utils.book_append_sheet(wb, ws2, 'Checklisty'); }
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([wbout], { type: 'application/octet-stream' });
    if(downloads) await downloads.save({ filename: 'domowe-sprawy.xlsx', data: blob });
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'domowe-sprawy.xlsx'; a.click(); }
  } catch(e){ console.error(e); alert('Nie udało się wyeksportować do Excela.'); }
}

async function exportWord(){
  try {
    if(typeof docx === 'undefined'){ alert('Nie udało się załadować biblioteki Worda — sprawdź połączenie i spróbuj ponownie.'); return; }
    const { Document, Packer, Paragraph, HeadingLevel, Table, TableRow, TableCell, TextRun, WidthType } = docx;
    const children = [ new Paragraph({ text: 'Domowe Sprawy — raport', heading: HeadingLevel.TITLE }) ];
    const headerCells = ['Podzadanie','Zadanie','Osoba','Termin','Priorytet','Status'];
    projects.forEach(p => {
      children.push(new Paragraph({ text: p.name + (p.due ? '  (termin: ' + p.due + ')' : ''), heading: HeadingLevel.HEADING_1 }));
      const projSections = sections.filter(s => s.projectId === p.id);
      const secList = projSections.length ? projSections : [{ id: null, name: 'Zadania ogólne' }];
      secList.forEach(s => {
        const secTasks = tasks.filter(t => t.projectId === p.id && t.sectionId === s.id);
        children.push(new Paragraph({ text: s.name + (s.due ? '  (termin: ' + s.due + ')' : ''), heading: HeadingLevel.HEADING_2 }));
        const rows = [ new TableRow({ children: headerCells.map(h => new TableCell({ children: [new Paragraph({ children:[new TextRun({text:h,bold:true})] })] })) }) ];
        if(secTasks.length){
          secTasks.forEach(t => {
            rows.push(new TableRow({ children: [
              new TableCell({ children: [new Paragraph(s.name)] }),
              new TableCell({ children: [new Paragraph(t.title)] }),
              new TableCell({ children: [new Paragraph(personName(t.person))] }),
              new TableCell({ children: [new Paragraph(t.due || '—')] }),
              new TableCell({ children: [new Paragraph(PRIORITY_LABEL[t.priority] || '—')] }),
              new TableCell({ children: [new Paragraph(STATUS_LABEL[t.status] || '—')] }),
            ] }));
          });
        } else {
          rows.push(new TableRow({ children: [ new TableCell({ children:[new Paragraph('Brak zadań')] }), new TableCell({children:[new Paragraph('')]}), new TableCell({children:[new Paragraph('')]}), new TableCell({children:[new Paragraph('')]}), new TableCell({children:[new Paragraph('')]}), new TableCell({children:[new Paragraph('')]}) ] }));
        }
        children.push(new Table({ rows, width: { size: 100, type: WidthType.PERCENTAGE } }));
        const secChecklist = checklistItems.filter(c => c.sectionId === s.id);
        if(secChecklist.length){
          children.push(new Paragraph({ text: 'Checklista:', spacing: { before: 120 } }));
          secChecklist.forEach(c => children.push(new Paragraph({ text: (c.checked ? '☑ ' : '☐ ') + c.label })));
        }
        const secLinks = links.filter(l => l.sectionId === s.id);
        if(secLinks.length){
          children.push(new Paragraph({ text: 'Linki:', spacing: { before: 120 } }));
          secLinks.forEach(l => children.push(new Paragraph({ text: (l.label ? l.label + ' — ' : '') + l.url })));
        }
      });
    });
    const doc = new Document({ sections: [{ properties: {}, children }] });
    const blob = await Packer.toBlob(doc);
    if(downloads) await downloads.save({ filename: 'domowe-sprawy.docx', data: blob });
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'domowe-sprawy.docx'; a.click(); }
  } catch(e){ console.error(e); alert('Nie udało się wyeksportować do Worda.'); }
}

function exportPdf(){
  try {
    const area = document.getElementById('printArea');
    let html = '<h1>Domowe Sprawy — raport</h1>';
    projects.forEach(p => {
      html += '<h2>' + escapeHtml(p.name) + (p.due ? ' (termin: ' + p.due + ')' : '') + '</h2>';
      const projSections = sections.filter(s => s.projectId === p.id);
      const secList = projSections.length ? projSections : [{ id: null, name: 'Zadania ogólne' }];
      secList.forEach(s => {
        const secTasks = tasks.filter(t => t.projectId === p.id && t.sectionId === s.id);
        html += '<h3>' + escapeHtml(s.name) + (s.due ? ' (termin: ' + s.due + ')' : '') + '</h3>';
        html += '<table><tr><th>Zadanie</th><th>Osoba</th><th>Termin</th><th>Priorytet</th><th>Status</th></tr>';
        if(secTasks.length){
          secTasks.forEach(t => {
            html += `<tr><td>${escapeHtml(t.title)}</td><td>${escapeHtml(personName(t.person))}</td><td>${t.due||'—'}</td><td>${PRIORITY_LABEL[t.priority]||'—'}</td><td>${STATUS_LABEL[t.status]||'—'}</td></tr>`;
          });
        } else { html += '<tr><td colspan="5">Brak zadań</td></tr>'; }
        html += '</table>';
        const secChecklist = checklistItems.filter(c => c.sectionId === s.id);
        if(secChecklist.length){
          html += '<p><b>Checklista:</b></p><ul>' + secChecklist.map(c => `<li>${c.checked?'☑':'☐'} ${escapeHtml(c.label)}</li>`).join('') + '</ul>';
        }
        const secLinks = links.filter(l => l.sectionId === s.id);
        if(secLinks.length){
          html += '<p><b>Linki:</b></p><ul>' + secLinks.map(l => `<li>${escapeHtml(l.label||l.url)} — ${escapeHtml(l.url)}</li>`).join('') + '</ul>';
        }
      });
    });
    area.innerHTML = html;
    document.body.classList.add('printing');
    const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 60);
  } catch(e){ console.error(e); alert('Nie udało się przygotować widoku PDF.'); }
}

init();
